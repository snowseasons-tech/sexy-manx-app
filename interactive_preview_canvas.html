<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dynamic Preview Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl shadow-lg shadow-cyan-500/20 text-white">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-500 to-blue-600 dark:from-cyan-400 dark:to-blue-400">
                    Aether Canvas
                </span>
            </div>

            <!-- Actions Right -->
            <div class="flex items-center space-x-3">
                <!-- Preset Modes -->
                <div class="hidden md:flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700">
                    <button id="presetConstellation" onclick="applyPreset('constellation')" class="px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 font-medium">Constellation</button>
                    <button id="presetQuantum" onclick="applyPreset('quantum')" class="px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 font-medium">Quantum</button>
                    <button id="presetFireflies" onclick="applyPreset('fireflies')" class="px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 font-medium">Fireflies</button>
                </div>

                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-all focus:outline-none focus:ring-2 focus:ring-cyan-500/50" aria-label="Toggle Theme">
                    <i id="themeIcon" data-lucide="sun" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
        
        <!-- Canvas Container Area (3 Cols on lg) -->
        <div class="lg:col-span-3 flex flex-col space-y-4">
            <!-- Canvas Frame -->
            <div class="relative w-full aspect-video sm:aspect-[16/9] lg:aspect-[16/10] bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none group">
                <!-- Interactive Canvas -->
                <canvas id="interactiveCanvas" class="w-full h-full cursor-crosshair block"></canvas>

                <!-- Overlay Stats Display -->
                <div class="absolute top-4 left-4 bg-slate-950/60 backdrop-blur-md border border-white/10 text-white rounded-xl px-3 py-2 text-xs font-mono flex items-center space-x-4 pointer-events-none select-none">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="fpsCounter">60 FPS</span>
                    </div>
                    <div class="text-slate-400">|</div>
                    <div>Nodes: <span id="particleCountDisplay">120</span></div>
                </div>

                <!-- Canvas Control Overlay Buttons -->
                <div class="absolute bottom-4 right-4 flex items-center space-x-2">
                    <button onclick="clearCanvas()" class="p-2 bg-slate-900/70 hover:bg-slate-900 text-white/80 hover:text-white rounded-lg backdrop-blur-md border border-white/10 transition-all text-xs flex items-center space-x-1" title="Clear Canvas">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <button id="playPauseBtn" onclick="togglePause()" class="p-2 bg-slate-900/70 hover:bg-slate-900 text-white/80 hover:text-white rounded-lg backdrop-blur-md border border-white/10 transition-all text-xs flex items-center space-x-1" title="Pause Animation">
                        <i id="pauseIcon" data-lucide="pause" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Hint text -->
            <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1">
                <span class="flex items-center space-x-1">
                    <i data-lucide="mouse-pointer" class="w-3.5 h-3.5 text-cyan-500"></i>
                    <span>Click or drag on the canvas to inject energy & spawn particles</span>
                </span>
                <span id="interactionModeText">Mode: Interactive Attraction</span>
            </div>
        </div>

        <!-- Controls Sidebar Panel (1 Col on lg) -->
        <aside class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h2 class="font-semibold text-slate-900 dark:text-slate-100 flex items-center space-x-2 text-sm">
                    <i data-lucide="sliders" class="w-4 h-4 text-cyan-500"></i>
                    <span>Control Panel</span>
                </h2>
                <button onclick="resetSettings()" class="text-xs text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors flex items-center space-x-1">
                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                    <span>Reset</span>
                </button>
            </div>

            <!-- Parameters Sliders -->
            <div class="space-y-4 text-xs font-medium">
                <!-- Particle Count Slider -->
                <div>
                    <div class="flex justify-between mb-1.5 text-slate-600 dark:text-slate-400">
                        <label for="particleCount">Particle Density</label>
                        <span id="particleCountVal" class="text-slate-900 dark:text-slate-200 font-mono">120</span>
                    </div>
                    <input type="range" id="particleCount" min="20" max="350" value="120" step="1"
                        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>

                <!-- Particle Speed Slider -->
                <div>
                    <div class="flex justify-between mb-1.5 text-slate-600 dark:text-slate-400">
                        <label for="particleSpeed">Movement Speed</label>
                        <span id="particleSpeedVal" class="text-slate-900 dark:text-slate-200 font-mono">1.5x</span>
                    </div>
                    <input type="range" id="particleSpeed" min="0.2" max="5.0" value="1.5" step="0.1"
                        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>

                <!-- Connection Radius Slider -->
                <div>
                    <div class="flex justify-between mb-1.5 text-slate-600 dark:text-slate-400">
                        <label for="connectionRadius">Connection Distance</label>
                        <span id="connectionRadiusVal" class="text-slate-900 dark:text-slate-200 font-mono">120px</span>
                    </div>
                    <input type="range" id="connectionRadius" min="40" max="250" value="120" step="5"
                        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>

                <!-- Size Multiplier Slider -->
                <div>
                    <div class="flex justify-between mb-1.5 text-slate-600 dark:text-slate-400">
                        <label for="particleSize">Node Size</label>
                        <span id="particleSizeVal" class="text-slate-900 dark:text-slate-200 font-mono">2.5px</span>
                    </div>
                    <input type="range" id="particleSize" min="1.0" max="8.0" value="2.5" step="0.5"
                        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>

                <!-- Color Palette Select -->
                <div class="pt-2">
                    <label class="block text-slate-600 dark:text-slate-400 mb-2">Palette Theme</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setPalette('cyan')" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-cyan-500 flex flex-col items-center justify-center space-y-1 group">
                            <span class="flex space-x-1">
                                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                            </span>
                            <span class="text-[10px] text-slate-500 group-hover:text-cyan-500">Neon</span>
                        </button>
                        <button onclick="setPalette('sunset')" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-orange-500 flex flex-col items-center justify-center space-y-1 group">
                            <span class="flex space-x-1">
                                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                            </span>
                            <span class="text-[10px] text-slate-500 group-hover:text-orange-500">Sunset</span>
                        </button>
                        <button onclick="setPalette('emerald')" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-emerald-500 flex flex-col items-center justify-center space-y-1 group">
                            <span class="flex space-x-1">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span>
                            </span>
                            <span class="text-[10px] text-slate-500 group-hover:text-emerald-500">Forest</span>
                        </button>
                    </div>
                </div>

                <!-- Interaction Type -->
                <div class="pt-2">
                    <label class="block text-slate-600 dark:text-slate-400 mb-2">Cursor Mode</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="modeAttractBtn" onclick="setInteractionMode('attract')" class="py-2 px-3 rounded-xl border border-cyan-500 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 text-xs text-center transition-all">Attract</button>
                        <button id="modeRepelBtn" onclick="setInteractionMode('repel')" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-cyan-500 text-xs text-center transition-all">Repel</button>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <!-- Footer Status Bar -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-3 text-xs text-slate-500 dark:text-slate-400 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center space-x-2">
                <span class="inline-block w-2 h-2 rounded-full bg-cyan-500"></span>
                <span>Interactive HTML5 Canvas Preview Window</span>
            </div>
            <div>
                <span>Powered by Dynamic JS & Tailwind CSS</span>
            </div>
        </div>
    </footer>

    <!-- Interactive Logic Script -->
    <script>
        // State Management
        let isDarkMode = true;
        let isPaused = false;
        let animationFrameId = null;

        // Configurable Parameters
        const config = {
            particleCount: 120,
            speedMultiplier: 1.5,
            connectionRadius: 120,
            particleSize: 2.5,
            palette: 'cyan',
            interactionMode: 'attract' // 'attract' or 'repel'
        };

        // Palette Colors Setup
        const colorPalettes = {
            cyan: {
                bgDark: '#090d16',
                bgLight: '#f1f5f9',
                particles: ['#06b6d4', '#3b82f6', '#6366f1', '#60a5fa'],
                lineDark: '6, 182, 212',
                lineLight: '59, 130, 246'
            },
            sunset: {
                bgDark: '#120a10',
                bgLight: '#fff7ed',
                particles: ['#f97316', '#f43f5e', '#e11d48', '#fbbf24'],
                lineDark: '249, 115, 22',
                lineLight: '244, 63, 94'
            },
            emerald: {
                bgDark: '#06120e',
                bgLight: '#f0fdf4',
                particles: ['#10b981', '#14b8a6', '#06b6d4', '#34d399'],
                lineDark: '16, 185, 129',
                lineLight: '20, 184, 166'
            }
        };

        // Canvas Setup
        const canvas = document.getElementById('interactiveCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        // FPS Counter Utility
        let lastCalledTime = performance.now();
        let fps = 60;

        // Particle Class definition
        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.baseVx = (Math.random() - 0.5) * 1.5;
                this.baseVy = (Math.random() - 0.5) * 1.5;
                this.vx = this.baseVx;
                this.vy = this.baseVy;
                this.radius = Math.random() * config.particleSize + 1;
                
                const palette = colorPalettes[config.palette].particles;
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            update() {
                // Adjust velocity by current speed multiplier
                const currentVx = this.vx * config.speedMultiplier;
                const currentVy = this.vy * config.speedMultiplier;

                this.x += currentVx;
                this.y += currentVy;

                // Wall Collisions (Bounce)
                if (this.x < 0 || this.x > canvas.width) {
                    this.vx *= -1;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.vy *= -1;
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }

                // Mouse Interactions
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius && dist > 0) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        const angle = Math.atan2(dy, dx);
                        const pushStrength = force * 2;

                        if (config.interactionMode === 'attract') {
                            this.x += Math.cos(angle) * pushStrength;
                            this.y += Math.sin(angle) * pushStrength;
                        } else {
                            this.x -= Math.cos(angle) * pushStrength;
                            this.y -= Math.sin(angle) * pushStrength;
                        }
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = isDarkMode ? 8 : 0;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset blur for performance
            }
        }

        // Initialize Canvas Particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
            updateParticleCountDisplay();
        }

        // Adjust Canvas Aspect Ratio and Size Dynamically
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Re-bind particle positions if out of bounds
            particles.forEach(p => {
                if (p.x > canvas.width) p.x = canvas.width - 10;
                if (p.y > canvas.height) p.y = canvas.height - 10;
            });
        }

        // Main Animation Loop
        function animate() {
            if (!isPaused) {
                // Clear Canvas
                const currentThemePalette = colorPalettes[config.palette];
                ctx.fillStyle = isDarkMode ? currentThemePalette.bgDark : currentThemePalette.bgLight;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Network Lines
                const lineRGB = isDarkMode ? currentThemePalette.lineDark : currentThemePalette.lineLight;
                
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < config.connectionRadius) {
                            const alpha = (1 - dist / config.connectionRadius) * (isDarkMode ? 0.35 : 0.25);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(${lineRGB}, ${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                // Render Particles
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                });

                // Calculate FPS
                const delta = (performance.now() - lastCalledTime) / 1000;
                lastCalledTime = performance.now();
                fps = Math.round(1 / delta);
                document.getElementById('fpsCounter').innerText = `${fps || 60} FPS`;
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // Interactive Mouse / Touch Events
        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        }

        function handlePointerLeave() {
            mouse.x = null;
            mouse.y = null;
        }

        function handlePointerClick(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Spawn explosive pulse particles on click
            for (let i = 0; i < 8; i++) {
                if (particles.length < 400) {
                    const p = new Particle(clickX, clickY);
                    p.vx = (Math.random() - 0.5) * 6;
                    p.vy = (Math.random() - 0.5) * 6;
                    particles.push(p);
                }
            }
            updateParticleCountDisplay();
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');

            if (isDarkMode) {
                htmlEl.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                htmlEl.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        // Controls & Input Listeners
        function setupControls() {
            // Particle Count Slider
            const countInput = document.getElementById('particleCount');
            countInput.addEventListener('input', (e) => {
                config.particleCount = parseInt(e.target.value);
                document.getElementById('particleCountVal').innerText = config.particleCount;
                
                // Adjust active array size
                while (particles.length < config.particleCount) {
                    particles.push(new Particle());
                }
                if (particles.length > config.particleCount) {
                    particles.splice(config.particleCount);
                }
                updateParticleCountDisplay();
            });

            // Speed Slider
            const speedInput = document.getElementById('particleSpeed');
            speedInput.addEventListener('input', (e) => {
                config.speedMultiplier = parseFloat(e.target.value);
                document.getElementById('particleSpeedVal').innerText = `${config.speedMultiplier.toFixed(1)}x`;
            });

            // Connection Radius Slider
            const radiusInput = document.getElementById('connectionRadius');
            radiusInput.addEventListener('input', (e) => {
                config.connectionRadius = parseInt(e.target.value);
                document.getElementById('connectionRadiusVal').innerText = `${config.connectionRadius}px`;
            });

            // Size Slider
            const sizeInput = document.getElementById('particleSize');
            sizeInput.addEventListener('input', (e) => {
                config.particleSize = parseFloat(e.target.value);
                document.getElementById('particleSizeVal').innerText = `${config.particleSize.toFixed(1)}px`;
                particles.forEach(p => p.radius = Math.random() * config.particleSize + 1);
            });
        }

        // Mode Toggles
        function setInteractionMode(mode) {
            config.interactionMode = mode;
            const attractBtn = document.getElementById('modeAttractBtn');
            const repelBtn = document.getElementById('modeRepelBtn');
            const modeText = document.getElementById('interactionModeText');

            if (mode === 'attract') {
                attractBtn.className = "py-2 px-3 rounded-xl border border-cyan-500 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 text-xs text-center transition-all font-medium";
                repelBtn.className = "py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-cyan-500 text-xs text-center transition-all";
                modeText.innerText = "Mode: Interactive Attraction";
            } else {
                repelBtn.className = "py-2 px-3 rounded-xl border border-cyan-500 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 text-xs text-center transition-all font-medium";
                attractBtn.className = "py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-cyan-500 text-xs text-center transition-all";
                modeText.innerText = "Mode: Repulsion Dynamics";
            }
        }

        function setPalette(paletteName) {
            config.palette = paletteName;
            initParticles();
        }

        // Presets System
        function applyPreset(preset) {
            const countInput = document.getElementById('particleCount');
            const speedInput = document.getElementById('particleSpeed');
            const radiusInput = document.getElementById('connectionRadius');
            const sizeInput = document.getElementById('particleSize');

            if (preset === 'constellation') {
                config.particleCount = 120;
                config.speedMultiplier = 1.0;
                config.connectionRadius = 140;
                config.particleSize = 2.0;
                setPalette('cyan');
            } else if (preset === 'quantum') {
                config.particleCount = 220;
                config.speedMultiplier = 2.5;
                config.connectionRadius = 70;
                config.particleSize = 1.5;
                setPalette('sunset');
            } else if (preset === 'fireflies') {
                config.particleCount = 70;
                config.speedMultiplier = 0.8;
                config.connectionRadius = 180;
                config.particleSize = 4.5;
                setPalette('emerald');
            }

            // Sync Inputs
            countInput.value = config.particleCount;
            speedInput.value = config.speedMultiplier;
            radiusInput.value = config.connectionRadius;
            sizeInput.value = config.particleSize;

            document.getElementById('particleCountVal').innerText = config.particleCount;
            document.getElementById('particleSpeedVal').innerText = `${config.speedMultiplier}x`;
            document.getElementById('connectionRadiusVal').innerText = `${config.connectionRadius}px`;
            document.getElementById('particleSizeVal').innerText = `${config.particleSize}px`;

            initParticles();
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseIcon = document.getElementById('pauseIcon');
            if (isPaused) {
                pauseIcon.setAttribute('data-lucide', 'play');
            } else {
                pauseIcon.setAttribute('data-lucide', 'pause');
            }
            lucide.createIcons();
        }

        function clearCanvas() {
            particles = [];
            updateParticleCountDisplay();
        }

        function resetSettings() {
            applyPreset('constellation');
            setInteractionMode('attract');
        }

        function updateParticleCountDisplay() {
            document.getElementById('particleCountDisplay').innerText = particles.length;
        }

        // Event Listeners Initialization
        window.onload = function() {
            // Initialize Lucide Icons
            lucide.createIcons();

            // Canvas Listeners
            window.addEventListener('resize', resizeCanvas);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('mouseleave', handlePointerLeave);
            canvas.addEventListener('click', handlePointerClick);

            // Mobile Touch Support
            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.touches[0].clientX - rect.left;
                    mouse.y = e.touches[0].clientY - rect.top;
                }
            }, { passive: true });

            canvas.addEventListener('touchend', handlePointerLeave);

            // Initialize Controls & Canvas
            setupControls();
            resizeCanvas();
            initParticles();

            // Start loop
            animate();
        };
    </script>
</body>
</html>
